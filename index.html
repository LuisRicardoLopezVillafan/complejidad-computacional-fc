<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Temas de exposición – Complejidad Computacional</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Temas de exposición</h1>
    <p>Complejidad Computacional · Problemas NP-completos. Elige un tema con tu nombre y correo; una vez elegido, deja de estar disponible para los demás.</p>
    <div class="controls">
      <input id="search" type="search" placeholder="Buscar tema…" aria-label="Buscar tema">
      <label><input id="only-free" type="checkbox" checked> Solo disponibles</label>
    </div>
    <div id="tag-filter" class="tags" role="group" aria-label="Filtrar por etiqueta"></div>
    <p id="counter" class="muted"></p>
  </header>

  <main id="list" aria-live="polite"></main>

  <dialog id="dialog">
    <form id="form" method="dialog">
      <h2>Elegir tema</h2>
      <p id="dialog-topic"></p>
      <label>Nombre completo <input id="name" required minlength="3" maxlength="120" autocomplete="name"></label>
      <label>Correo electrónico <input id="email" type="email" required maxlength="150" autocomplete="email"></label>
      <p class="muted">Solo puedes elegir un tema. Para cambiarlo, escribe al profesor.</p>
      <p id="error" class="error" hidden></p>
      <div class="actions">
        <button type="button" id="cancel">Cancelar</button>
        <button type="submit" id="confirm" class="primary">Confirmar</button>
      </div>
    </form>
  </dialog>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
